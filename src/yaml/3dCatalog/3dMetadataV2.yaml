        maxResolutionMeter:
          type: number
          format: double
          nullable: true
          example: 1.5
          minimum: 0.01
          maximum: 8000
          description: Maximum resolution in meters
        maxAbsoluteAccuracyCEP90:
          type: number
          format: double
          minimum: 0
          maximum: 999
          description: Maximum absolute CEP90 horizontal accuracy
        maxRelativeAccuracyCEP90:
          type: number
          format: double
          minimum: 0
          maximum: 999
          description: Maximum relative CEP90 horizontal accuracy
        maxRelativeAccuracyLEP90:
          type: number
          format: double
          minimum: 0
          maximum: 999
          description: Maximum relative LEP90 vertical accuracy
        maxAbsoluteAccuracyLEP90:
          type: number
          format: double
          minimum: 0
          maximum: 999
          nullable: true
          description: Maximum absolute LEP90 vertical accuracy
        maxAbsoluteAccuracySEP90:
          type: number
